<!doctype html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#126b38">
  <meta name="description" content="Kanifnath KSK - item purchase and sales rates">
  <title>Kanifnath KSK | Rate Book</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img class="brand-logo" src="assets/logo.png" alt="कानिफनाथ के एस के logo">
    <div><div class="brand-name">Kanifnath KSK</div><div class="brand-sub">कानिफनाथ के एस के · Rate Book</div></div>
  </header>

  <main class="wrap">
    <section class="intro">
      <p class="eyebrow">कृषी सेवा केंद्र</p>
      <h1>Item Rate Search</h1>
      <p class="muted">Search an item name to view its purchase and sales rates.</p>
    </section>

    <section class="search-card">
      <label for="searchInput">Search item / वस्तूचे नाव शोधा</label>
      <input id="searchInput" type="search" placeholder="Type item name..." autocomplete="off">
      <div class="small-row"><span id="status">Loading rates…</span><button id="refreshBtn" class="text-button" type="button">Refresh</button></div>
    </section>

    <section class="results-head"><h2>Available items</h2><span id="count"></span></section>
    <div id="results" class="results" aria-live="polite"></div>
    <p class="footer-note">Rates shown here are read from the connected Google Sheet. Confirm the latest rate before billing.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
